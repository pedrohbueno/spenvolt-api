spring.application.name=spenvolt-api

# Porta disponibilizada pelo Render
server.port=${PORT:8080}

# Conexão com PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexões
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# Evita manter a sessão JPA aberta durante toda a requisição web
spring.jpa.open-in-view=false

spring.security.user.name=${APP_SECURITY_USER}
spring.security.user.password=${APP_SECURITY_PASSWORD}